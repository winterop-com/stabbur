[project]
name = "kodo-mcp-search"
version = "0.1.0"
description = "Kodo MCP server: web search -> titled results (title, url, snippet), over stdio"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.2",
    "pluginkit>=0.4.7",
    "pydantic-settings>=2.14.2",
    "httpx>=0.28",
]

# Console script -> main() re-exported from the package root. A new MCP keeps this
# line, renaming both sides to its own kodo-mcp-<name>.
[project.scripts]
kodo-mcp-search = "kodo_mcp_search:main"

# Advertise-only kodo plugin: makes this server discoverable (kodo mcp list, --mcp
# resolution) without contributing a command. Still a pure MCP server otherwise.
[project.entry-points."kodo.plugins"]
search = "kodo_mcp_search.plugin:PLUGIN"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "kodo-mcp-http"
version = "0.1.0"
description = "Kodo MCP server: an SSRF-guarded, allowlisted HTTP fetch tool (over stdio)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.2",
    "httpx>=0.28.1",
    "pluginkit>=0.4.7",
    "pydantic-settings>=2.14.2",
]

[project.scripts]
kodo-mcp-http = "kodo_mcp_http:main"

[project.entry-points."kodo.plugins"]
http = "kodo_mcp_http.plugin:PLUGIN"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

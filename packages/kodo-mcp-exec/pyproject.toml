[project]
name = "kodo-mcp-exec"
version = "0.1.0"
description = "Kodo MCP server: run a Python snippet in a locked-down Docker sandbox (over stdio)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.2",
    "kodo-sandbox",
    "pluginkit>=0.4.7",
]

[project.scripts]
kodo-mcp-exec = "kodo_mcp_exec:main"

[project.entry-points."kodo.plugins"]
exec = "kodo_mcp_exec.plugin:PLUGIN"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

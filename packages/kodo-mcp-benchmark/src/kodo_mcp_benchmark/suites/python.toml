name = "python"
description = "Python programs that read stdin and write stdout, across difficulty tiers."
language = "python"

[[problems]]
id = "sum-two"
difficulty = "basics"
prompt = "Read two integers on a single line separated by a space, and print their sum."
[[problems.tests]]
stdin = "2 3\n"
expected_stdout = "5"
[[problems.tests]]
stdin = "10 -4\n"
expected_stdout = "6"
[[problems.tests]]
stdin = "0 0\n"
expected_stdout = "0"

[[problems]]
id = "reverse-string"
difficulty = "basics"
prompt = "Read a single line of text and print it reversed."
[[problems.tests]]
stdin = "hello\n"
expected_stdout = "olleh"
[[problems.tests]]
stdin = "racecar\n"
expected_stdout = "racecar"

[[problems]]
id = "count-words"
difficulty = "basics"
prompt = "Read a line of text and print the number of whitespace-separated words on it."
[[problems.tests]]
stdin = "the quick brown fox\n"
expected_stdout = "4"
[[problems.tests]]
stdin = "hello\n"
expected_stdout = "1"

[[problems]]
id = "fizzbuzz"
difficulty = "intermediate"
prompt = """Read an integer n and print the numbers from 1 to n, one per line. For multiples \
of 3 print "Fizz" instead of the number, for multiples of 5 print "Buzz", and for multiples \
of both 3 and 5 print "FizzBuzz"."""
[[problems.tests]]
stdin = "5\n"
expected_stdout = "1\n2\nFizz\n4\nBuzz"
[[problems.tests]]
stdin = "15\n"
expected_stdout = "1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz"

[[problems]]
id = "reverse-words"
difficulty = "intermediate"
prompt = "Read a line of text and print its whitespace-separated words in reverse order, single-spaced."
[[problems.tests]]
stdin = "the quick brown fox\n"
expected_stdout = "fox brown quick the"
[[problems.tests]]
stdin = "hello world\n"
expected_stdout = "world hello"

[[problems]]
id = "count-primes"
difficulty = "advanced"
prompt = "Read an integer n and print how many prime numbers are less than or equal to n."
[[problems.tests]]
stdin = "10\n"
expected_stdout = "4"
[[problems.tests]]
stdin = "2\n"
expected_stdout = "1"
[[problems.tests]]
stdin = "1\n"
expected_stdout = "0"
[[problems.tests]]
stdin = "30\n"
expected_stdout = "10"

[[problems]]
id = "expr-eval"
difficulty = "expert"
prompt = "Evaluate the arithmetic expression on the input line and print the integer result. It contains non-negative integers, the binary operators +, -, and *, parentheses, and spaces, with standard operator precedence."
[[problems.tests]]
stdin = "3 + 4 * 2\n"
expected_stdout = "11"
[[problems.tests]]
stdin = "(1 + 2) * 3\n"
expected_stdout = "9"
[[problems.tests]]
stdin = "2 * (3 + 4) - 5\n"
expected_stdout = "9"
[[problems.tests]]
stdin = "10 - 2 - 3\n"
expected_stdout = "5"

[[problems]]
id = "edit-distance"
difficulty = "expert"
prompt = "Read two lines of text. Print the Levenshtein edit distance between them: the minimum number of single-character insertions, deletions, or substitutions to turn the first line into the second."
[[problems.tests]]
stdin = "kitten\nsitting\n"
expected_stdout = "3"
[[problems.tests]]
stdin = "flaw\nlawn\n"
expected_stdout = "2"
[[problems.tests]]
stdin = "abc\nabc\n"
expected_stdout = "0"
[[problems.tests]]
stdin = "a\nabc\n"
expected_stdout = "2"

[[problems]]
id = "lis"
difficulty = "expert"
prompt = "Read an integer n, then a second line with n space-separated integers. Print the length of the longest strictly increasing subsequence."
[[problems.tests]]
stdin = "7\n10 9 2 5 3 7 101\n"
expected_stdout = "4"
[[problems.tests]]
stdin = "5\n1 2 3 4 5\n"
expected_stdout = "5"
[[problems.tests]]
stdin = "5\n5 4 3 2 1\n"
expected_stdout = "1"
[[problems.tests]]
stdin = "6\n3 10 2 1 20 4\n"
expected_stdout = "3"

[[problems]]
id = "interval-merge"
difficulty = "expert"
prompt = "Read an integer n, then n lines each with two integers 'start end' describing a closed interval. Print the merged, non-overlapping intervals in increasing order, one 'start end' per line. Touching intervals (e.g. [1,4] and [4,5]) merge."
[[problems.tests]]
stdin = "4\n1 3\n2 6\n8 10\n15 18\n"
expected_stdout = "1 6\n8 10\n15 18"
[[problems.tests]]
stdin = "2\n1 4\n4 5\n"
expected_stdout = "1 5"
[[problems.tests]]
stdin = "3\n1 10\n2 3\n4 5\n"
expected_stdout = "1 10"
[[problems.tests]]
stdin = "3\n5 6\n1 2\n3 4\n"
expected_stdout = "1 2\n3 4\n5 6"

[[problems]]
id = "shortest-path"
difficulty = "expert"
prompt = "Read 'n m' (n nodes numbered 0..n-1 and m edges), then m lines 'u v w' describing undirected edges with non-negative integer weight w, then a final line 's t'. Print the length of the shortest path from s to t, or -1 if t is unreachable."
[[problems.tests]]
stdin = "4 4\n0 1 1\n1 2 2\n0 2 4\n2 3 1\n0 3\n"
expected_stdout = "4"
[[problems.tests]]
stdin = "3 1\n0 1 5\n0 2\n"
expected_stdout = "-1"
[[problems.tests]]
stdin = "2 1\n0 1 7\n0 1\n"
expected_stdout = "7"
[[problems.tests]]
stdin = "5 6\n0 1 2\n0 2 4\n1 2 1\n1 3 7\n2 4 3\n4 3 1\n0 3\n"
expected_stdout = "7"

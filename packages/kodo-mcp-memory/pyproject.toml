[project]
name = "kodo-mcp-memory"
version = "0.1.0"
description = "Kodo MCP server: persistent notes / key-value memory saved in the library (over stdio)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.2",
    "pluginkit>=0.4.7",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.2",
]

[project.scripts]
kodo-mcp-memory = "kodo_mcp_memory:main"

# Advertise-only kodo plugin: makes this server discoverable (kodo mcp list, --mcp
# resolution) without contributing a command. Still a pure MCP server otherwise.
[project.entry-points."kodo.plugins"]
memory = "kodo_mcp_memory.plugin:PLUGIN"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

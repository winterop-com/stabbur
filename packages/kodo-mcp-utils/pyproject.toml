[project]
name = "kodo-mcp-utils"
version = "0.1.0"
description = "Kodo MCP server: core utility tools (text, encoding, hashing, JSON, math, stats)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.2",
    "pluginkit>=0.4.7",
]

[project.scripts]
kodo-mcp-utils = "kodo_mcp_utils:main"

# Advertise-only kodo plugin: makes this server discoverable (kodo mcp list, --mcp
# resolution) without contributing a command. Still a pure MCP server otherwise.
[project.entry-points."kodo.plugins"]
utils = "kodo_mcp_utils.plugin:PLUGIN"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

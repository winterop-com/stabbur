[project]
name = "kodo-mcp-shell"
version = "0.1.0"
description = "Kodo MCP server: run host shell commands (read-only allowlist by default; opt-in full mode)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.2",
    "pluginkit>=0.4.7",
]

[project.scripts]
kodo-mcp-shell = "kodo_mcp_shell:main"

[project.entry-points."kodo.plugins"]
shell = "kodo_mcp_shell.plugin:PLUGIN"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

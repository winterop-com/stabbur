[project]
name = "kodo-mcp-git"
version = "0.1.0"
description = "Kodo MCP server: read-only git inspection (status/log/diff/show/…) sandboxed to one repo (over stdio)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.2",
    "pluginkit>=0.4.7",
    "pydantic-settings>=2.14.2",
]

[project.scripts]
kodo-mcp-git = "kodo_mcp_git:main"

[project.entry-points."kodo.plugins"]
git = "kodo_mcp_git.plugin:PLUGIN"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

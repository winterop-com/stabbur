[project]
name = "kodo-mcp-weather-yr"
version = "0.1.0"
description = "Kodo MCP server: weather forecasts from the free met.no (yr.no) API (over stdio)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.2",
    "httpx>=0.28.1",
    "pluginkit>=0.4.7",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.2",
]

[project.scripts]
kodo-mcp-weather-yr = "kodo_mcp_weather_yr:main"

# Advertise-only kodo plugin: makes this server discoverable (kodo mcp list, --mcp
# resolution) without contributing a command. Still a pure MCP server otherwise.
[project.entry-points."kodo.plugins"]
weather-yr = "kodo_mcp_weather_yr.plugin:PLUGIN"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "kodo-mcp-files"
version = "0.1.0"
description = "Kodo MCP server: read-only file browse/read/search under one configured root (over stdio)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.4.2",
    "pluginkit>=0.4.7",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.2",
]

[project.scripts]
kodo-mcp-files = "kodo_mcp_files:main"

[project.entry-points."kodo.plugins"]
files = "kodo_mcp_files.plugin:PLUGIN"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "heim"
version = "0.5.0"
description = "Heim — build a local LLM library, then run, chat, and serve it — fully on-box"
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
keywords = ["llm", "local-llm", "self-hosted", "mcp", "agent", "dhis2", "fastapi", "huggingface"]
classifiers = [
    # PyPI refuses an upload carrying this, which is the point: heim is source-available and
    # proprietary, installed from the repo with `uv tool install`. CLAUDE.md has claimed this
    # guard exists since the rename that dropped it, so the claim is made true rather than
    # deleted - the intent behind it never changed.
    "Private :: Do Not Upload",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi[standard]>=0.138.2",
    "fastmcp>=3.4.2",
    "hf-xet>=1.5.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.21.0",
    # The bundled first-party MCP tool servers are now VENDORED into this package (see
    # `src/heim/mcp_servers/*`) rather than being separate `heim-mcp-*` workspace members.
    # heim ships a working tool set out of the box with zero unpublished `heim-*` runtime
    # deps, so `pip install heim` resolves cleanly. Their console scripts + `heim.plugins`
    # entry points are declared on this distribution below; the third-party libraries the
    # base servers import (fastmcp, pluginkit, httpx, pydantic, pydantic-settings) are
    # listed here. The heavier web reader (Playwright/trafilatura) stays in the `web` extra.
    "pydantic>=2.0",
    # Kokoro-82M (ONNX) — the lightweight, cross-platform in-chat voice. A base dep (not an
    # extra) so "Listen"/speak works out of the box on every install; the design treats it as
    # always-available, and it's self-contained (kokoro-onnx bundles espeak-ng via
    # espeakng_loader, soundfile bundles libsndfile — no system packages). The heavier
    # Apple-only mlx-audio runtime (Dia/Whisper) stays the opt-in `voice` extra.
    "kokoro-onnx>=0.4.9",
    "pluginkit>=0.4.7",
    "pydantic-settings>=2.14.2",
    "soundfile>=0.13.1",
    "textual>=0.85",
    "typer>=0.25.1",
    "uvicorn[standard]>=0.49.0",
]

[project.optional-dependencies]
# Apple-Silicon MLX runtimes. Optional + platform-gated: heim spawns these as
# OpenAI servers (it does not import them), and they have no Linux wheels, so
# they must never be hard deps. mlx-vlm serves multimodal MLX checkpoints that
# text-only mlx-lm can't load. Install with `uv sync --extra mlx` on an M-series
# Mac (a no-op elsewhere). llama.cpp's `llama-server` stays external (a C++
# binary; `brew install llama.cpp`).
mlx = [
    "mlx-lm>=0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-vlm>=0.6.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # transformers 5.13 broke AutoTokenizer.register (now requires a config class, not a
    # string) — mlx-lm 0.31.3 passes a string and crashes at import, so any MLX model fails
    # to load. Cap below 5.13 until mlx-lm ships a compatible register call. Remove when it does.
    "transformers>=5.5,<5.13; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# NOTE: Kokoro-82M (ONNX) TTS moved to [project.dependencies] — it's the always-available
# in-chat voice, no longer an opt-in extra. See the note there.

# Full voice runtime via mlx-audio (Apple Silicon): the registry's TTS/STT models
# (see heim.voice.registry), run in-process. mlx-audio is gated (mlx, Apple-only, no
# Linux wheels); its per-model
# helpers (misaki G2P for Kokoro, soundfile) are cross-platform. On Linux, the base
# Kokoro-ONNX dep covers TTS. Install with `uv sync --extra voice` on an M-series Mac.
voice = [
    "mlx-audio>=0.4.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "misaki[en]>=0.9.4",  # grapheme->phoneme for Kokoro (English backend)
    "soundfile>=0.13.1",
    # Some mlx-audio models import the soxr resampler at load time but mlx-audio does not
    # declare it; without it those models die on "No module named 'soxr'".
    "soxr>=0.5",
    # mlx-audio pulls in mlx-lm, which crashes at import on transformers 5.13 (the
    # AutoTokenizer.register break — see the `mlx` extra). A project using [voice] without
    # [mlx] would otherwise resolve an unbounded transformers and Whisper STT dies. Cap here
    # too so [voice] alone is self-consistent. Keep in lockstep with the `mlx` extra.
    "transformers>=5.5,<5.13; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# Web reader MCP server (vendored at `src/heim/mcp_servers/web`): reads a page in a headless
# browser and returns Markdown. Optional because Playwright + Chromium are heavy (a ~150 MB
# browser via `playwright install chromium`), unlike the bundled stdlib servers. Install with
# `uv sync --extra web` (or `make install-web`, which also fetches the browser). The server's
# code ships in the base wheel, but these heavy libraries are pulled in only via this extra;
# without them the `heim-mcp-web` console script errors on import rather than at install.
web = [
    "playwright>=1.47",
    "trafilatura>=1.12",
]

# Benchmarking / eval harness (vendored at `src/heim/benchmark`): contributes the `heim
# benchmark` command for measuring model quality across a suite. Its code + `heim.plugins`
# entry point ship in the base wheel; all its third-party deps (fastmcp, httpx, pluginkit,
# pydantic, typer) are already base deps, so this extra adds nothing on PyPI. It's retained
# as a named extra so `uv sync --extra benchmark` (and `make install`) stay valid, and so
# the Docker-sandboxed executor (`heim-sandbox`, a dev-only workspace member — see
# [dependency-groups]) is present in the dev environment where benchmarks actually run.
benchmark = []

[project.urls]
Homepage = "https://github.com/winterop-com/heim"
Repository = "https://github.com/winterop-com/heim"
Documentation = "https://github.com/winterop-com/heim/tree/main/docs"
Issues = "https://github.com/winterop-com/heim/issues"

[project.scripts]
heim = "heim.cli:main"
# Vendored MCP tool servers — heim spawns these by console-script name (see
# `heim.tools._bin_dir`/`_mcp_env`); it never imports them. Each points at the
# vendored subpackage's re-exported `main`.
heim-mcp-datetime = "heim.mcp_servers.datetime:main"
heim-mcp-exec = "heim.mcp_servers.exec:main"
heim-mcp-files = "heim.mcp_servers.files:main"
heim-mcp-git = "heim.mcp_servers.git:main"
heim-mcp-http = "heim.mcp_servers.http:main"
heim-mcp-memory = "heim.mcp_servers.memory:main"
heim-mcp-network = "heim.mcp_servers.network:main"
heim-mcp-search = "heim.mcp_servers.search:main"
heim-mcp-shell = "heim.mcp_servers.shell:main"
heim-mcp-utils = "heim.mcp_servers.utils:main"
heim-mcp-weather-yr = "heim.mcp_servers.weather_yr:main"
heim-mcp-web = "heim.mcp_servers.web:main"
heim-benchmark = "heim.benchmark:main"

# Vendored plugins — discovered by heim's PluginManager (group "heim.plugins"). The MCP
# servers advertise themselves (advertise-only, no command); benchmark contributes the
# `heim benchmark` command group.
[project.entry-points."heim.plugins"]
datetime = "heim.mcp_servers.datetime.plugin:PLUGIN"
exec = "heim.mcp_servers.exec.plugin:PLUGIN"
files = "heim.mcp_servers.files.plugin:PLUGIN"
git = "heim.mcp_servers.git.plugin:PLUGIN"
http = "heim.mcp_servers.http.plugin:PLUGIN"
memory = "heim.mcp_servers.memory.plugin:PLUGIN"
network = "heim.mcp_servers.network.plugin:PLUGIN"
search = "heim.mcp_servers.search.plugin:PLUGIN"
shell = "heim.mcp_servers.shell.plugin:PLUGIN"
utils = "heim.mcp_servers.utils.plugin:PLUGIN"
weather-yr = "heim.mcp_servers.weather_yr.plugin:PLUGIN"
web = "heim.mcp_servers.web.plugin:PLUGIN"
benchmark = "heim.benchmark.plugin:PLUGIN"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

# uv workspace: the app (this package) plus the sole remaining member, heim-sandbox — the
# Docker-sandboxed code executor shared by the vendored `exec` server and benchmark harness.
# It stays a separate workspace member (dev/test-only, unpublished) so it never becomes a
# `heim-*` runtime dependency of the wheel; it's pulled into the dev env via [dependency-groups].
[tool.uv.workspace]
members = ["packages/heim-sandbox"]

[tool.uv.sources]
heim-sandbox = { workspace = true }

[tool.fastapi]
# Let `fastapi dev` / `fastapi run` auto-detect the app.
entrypoint = "heim.app:app"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
fixable = ["ALL"]
select = ["E", "W", "F", "I", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"packages/*/tests/**/*.py" = ["D"]
"**/__init__.py" = ["D104"]
"src/**/*.py" = ["D102", "D105", "D107"]
"packages/*/src/**/*.py" = ["D102", "D105", "D107"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages"]  # recurse packages/ to pick up every member's tests/
norecursedirs = [".git", ".venv", "__pycache__"]
# Exclude the live e2e tests by default so a bare `pytest` / `uv run pytest` stays
# hermetic (they spawn a real runtime and need a working local model). Opt in with
# `pytest -m slow`. `make test` passes its own `-m "not slow"`, which still works.
addopts = "-m 'not slow'"
markers = [
  "slow: live end-to-end tests that start a real runtime (deselect with -m 'not slow')",
]

[tool.coverage.run]
branch = true
dynamic_context = "test_function"
relative_files = true
source = ["heim", "heim_sandbox"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
precision = 2
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
strict_equality = true
# The remaining workspace member (packages/heim-sandbox) goes on MYPYPATH via the Makefile
# (glob-expanded) so its module resolves under a clean, hyphen-free name. The vendored MCP
# servers now live under src/heim/mcp_servers/** and resolve via the `src` root below.
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Optional `tts` extra: untyped (soundfile/espeakng_loader) or absent when the
# extra isn't synced. Treat as Any so `make check` passes with or without it.
module = [
    "soundfile.*",
    "espeakng_loader.*",
    "kokoro_onnx.*",
    "mlx.*",
    "mlx_audio.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional `web` extra: playwright ships types but trafilatura doesn't, and both are
# absent in the base env. Treat as Any so `make check` passes with or without the extra.
module = ["playwright.*", "trafilatura.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src", "tests", "packages/*/src", "packages/*/tests"]
exclude = ["**/.venv"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportPrivateUsage = false
reportUnusedFunction = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportMissingTypeArgument = false
reportMissingTypeStubs = false
reportUnknownLambdaType = false
reportMissingImports = "warning"
reportMissingModuleSource = false

[dependency-groups]
dev = [
    "coverage>=7.14.3",
    "httpx>=0.28.1",
    # Docker-sandboxed executor shared by the vendored `exec` server + benchmark harness.
    # A workspace member declared here (not in [project.dependencies] / extras) so it is
    # installed in the dev/CI environment — where its tests and Docker-backed runs live —
    # without ever emitting a `Requires-Dist: heim-*` line in the published wheel.
    "heim-sandbox",
    "mkdocs>=1.6.1",
    "mkdocs-git-revision-date-localized-plugin>=1.3.0",
    "mkdocs-glightbox>=0.4.0",
    "mkdocs-material>=9.7.6",
    "mkdocs-panzoom-plugin>=0.2.0",
    "mkdocstrings[python]>=1.0.4",
    "mypy>=2.1.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

[project]
name = "kodo"
version = "0.1.0"
description = "Kodo — build a local LLM library, then run, chat, and serve it — fully on-box"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.138.2",
    "fastmcp>=3.4.2",
    "hf-xet>=1.5.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.21.0",
    "kodo-benchmark",
    "kodo-mcp-datetime",
    "kodo-mcp-memory",
    "kodo-mcp-search",
    "kodo-mcp-utils",
    "pluginkit>=0.4.7",
    "pydantic-settings>=2.14.2",
    "textual>=0.85",
    "typer>=0.25.1",
    "uvicorn[standard]>=0.49.0",
]

[project.optional-dependencies]
# Apple-Silicon MLX runtimes. Optional + platform-gated: kodo spawns these as
# OpenAI servers (it does not import them), and they have no Linux wheels, so
# they must never be hard deps. mlx-vlm serves multimodal MLX checkpoints that
# text-only mlx-lm can't load. Install with `uv sync --extra mlx` on an M-series
# Mac (a no-op elsewhere). llama.cpp's `llama-server` stays external (a C++
# binary; `brew install llama.cpp`).
mlx = [
    "mlx-lm>=0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-vlm>=0.6.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # transformers 5.13 broke AutoTokenizer.register (now requires a config class, not a
    # string) — mlx-lm 0.31.3 passes a string and crashes at import, so any MLX model fails
    # to load. Cap below 5.13 until mlx-lm ships a compatible register call. Remove when it does.
    "transformers>=5.5,<5.13; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# Local multi-voice text-to-speech via Kokoro-82M (ONNX). Optional, but unlike
# `mlx` NOT platform-gated: onnxruntime ships wheels for both macOS (Apple
# Silicon) and Linux, so one backend covers both. Gives 54 built-in named voices
# with no reference audio. Needs the `espeak-ng` system binary for phonemization
# (`brew install espeak-ng` / `apt install espeak-ng`); kodo hints if it's
# missing rather than hanging. Install with `uv sync --extra tts`.
tts = [
    "kokoro-onnx>=0.4.9",
    "soundfile>=0.13.1",
]

# Full voice runtime via mlx-audio (Apple Silicon): Dia (dialogue + cloning), Kokoro,
# Qwen3-TTS, and Whisper STT, served through mlx-audio's OpenAI /v1/audio server which kodo
# spawns + proxies. mlx-audio is gated (mlx, Apple-only, no Linux wheels); its per-model
# helpers (misaki G2P for Kokoro, soundfile) are cross-platform. On Linux, the `tts` extra's
# Kokoro-ONNX covers TTS. Install with `uv sync --extra voice` on an M-series Mac.
voice = [
    "mlx-audio>=0.4.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "misaki[en]>=0.9.4",  # grapheme->phoneme for Kokoro (English backend)
    "soundfile>=0.13.1",
]

# Web reader MCP server (kodo-mcp-web): reads a page in a headless browser and returns
# Markdown. Optional because Playwright + Chromium are heavy (a ~150 MB browser via
# `playwright install chromium`), unlike the bundled stdlib servers. Install with
# `uv sync --extra web` (or `make install-web`, which also fetches the browser). The pure
# stdlib/light servers stay bundled in [project.dependencies]; this one is opt-in.
web = [
    "kodo-mcp-web",
]

[project.scripts]
kodo = "kodo.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

# uv workspace: the app (this package) plus one bundled MCP server per package under
# packages/kodo-mcp-*/. New servers (e.g. kodo-mcp-weather-yr) are sibling members and
# join automatically via the glob; add each as a dependency + source below to bundle it.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
kodo-mcp-datetime = { workspace = true }
kodo-mcp-memory = { workspace = true }
kodo-benchmark = { workspace = true }
kodo-mcp-search = { workspace = true }
kodo-mcp-utils = { workspace = true }
kodo-mcp-web = { workspace = true }  # optional (the `web` extra); heavy Playwright deps

[tool.fastapi]
# Let `fastapi dev` / `fastapi run` auto-detect the app.
entrypoint = "kodo.app:app"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
fixable = ["ALL"]
select = ["E", "W", "F", "I", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"packages/*/tests/**/*.py" = ["D"]
"**/__init__.py" = ["D104"]
"src/**/*.py" = ["D102", "D105", "D107"]
"packages/*/src/**/*.py" = ["D102", "D105", "D107"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages"]  # recurse packages/ to pick up every member's tests/
norecursedirs = [".git", ".venv", "__pycache__"]
# Exclude the live e2e tests by default so a bare `pytest` / `uv run pytest` stays
# hermetic (they spawn a real runtime and need a working local model). Opt in with
# `pytest -m slow`. `make test` passes its own `-m "not slow"`, which still works.
addopts = "-m 'not slow'"
markers = [
  "slow: live end-to-end tests that start a real runtime (deselect with -m 'not slow')",
]

[tool.coverage.run]
branch = true
dynamic_context = "test_function"
relative_files = true
source = ["kodo", "kodo_mcp_datetime", "kodo_mcp_memory", "kodo_benchmark"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
precision = 2
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
strict_equality = true
# Member roots go on MYPYPATH via the Makefile (glob-expanded) so each flat module
# (packages/kodo-mcp-*/kodo_mcp_*.py) resolves to a clean, hyphen-free module name.
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Optional `tts` extra: untyped (soundfile/espeakng_loader) or absent when the
# extra isn't synced. Treat as Any so `make check` passes with or without it.
module = [
    "soundfile.*",
    "espeakng_loader.*",
    "kokoro_onnx.*",
    "mlx.*",
    "mlx_lm.*",
    "mlx_vlm.*",
    "mlx_audio.*",
    "misaki.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional `web` extra: playwright ships types but trafilatura doesn't, and both are
# absent in the base env. Treat as Any so `make check` passes with or without the extra.
module = ["playwright.*", "trafilatura.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src", "tests", "packages/*/src", "packages/*/tests"]
exclude = ["**/.venv"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportPrivateUsage = false
reportUnusedFunction = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportMissingTypeArgument = false
reportMissingTypeStubs = false
reportUnknownLambdaType = false
reportMissingImports = "warning"
reportMissingModuleSource = false

[dependency-groups]
dev = [
    "coverage>=7.14.3",
    "httpx>=0.28.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
    "mypy>=2.1.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

[project]
name = "kodo"
version = "0.1.0"
description = "Kodo — build a local LLM library, then run, chat, and serve it — fully on-box"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.138.2",
    "fastmcp>=3.4.2",
    "hf-xet>=1.5.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.21.0",
    "pydantic-settings>=2.14.2",
    "textual>=0.85",
    "typer>=0.25.1",
    "uvicorn[standard]>=0.49.0",
]

[project.optional-dependencies]
# Apple-Silicon MLX runtimes. Optional + platform-gated: kodo spawns these as
# OpenAI servers (it does not import them), and they have no Linux wheels, so
# they must never be hard deps. mlx-vlm serves multimodal MLX checkpoints that
# text-only mlx-lm can't load. Install with `uv sync --extra mlx` on an M-series
# Mac (a no-op elsewhere). llama.cpp's `llama-server` stays external (a C++
# binary; `brew install llama.cpp`).
mlx = [
    "mlx-lm>=0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-vlm>=0.6.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# Local multi-voice text-to-speech via Kokoro-82M (ONNX). Optional, but unlike
# `mlx` NOT platform-gated: onnxruntime ships wheels for both macOS (Apple
# Silicon) and Linux, so one backend covers both. Gives 54 built-in named voices
# with no reference audio. Needs the `espeak-ng` system binary for phonemization
# (`brew install espeak-ng` / `apt install espeak-ng`); kodo hints if it's
# missing rather than hanging. Install with `uv sync --extra tts`.
tts = [
    "kokoro-onnx>=0.4.9",
    "soundfile>=0.13.1",
]

[project.scripts]
kodo = "kodo.cli:app"
kodo-mcp-datetime = "kodo.mcp.datetime_server:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.fastapi]
# Let `fastapi dev` / `fastapi run` auto-detect the app.
entrypoint = "kodo.app:app"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
fixable = ["ALL"]
select = ["E", "W", "F", "I", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"**/__init__.py" = ["D104"]
"src/**/*.py" = ["D102", "D105", "D107"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "__pycache__"]
markers = [
  "slow: live end-to-end tests that start a real runtime (deselect with -m 'not slow')",
]

[tool.coverage.run]
branch = true
dynamic_context = "test_function"
relative_files = true
source = ["kodo"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
precision = 2
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
strict_equality = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Optional `tts` extra: untyped (soundfile/espeakng_loader) or absent when the
# extra isn't synced. Treat as Any so `make check` passes with or without it.
module = ["soundfile.*", "espeakng_loader.*", "kokoro_onnx.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/.venv"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportPrivateUsage = false
reportUnusedFunction = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportMissingTypeArgument = false
reportMissingTypeStubs = false
reportUnknownLambdaType = false
reportMissingImports = "warning"
reportMissingModuleSource = false

[dependency-groups]
dev = [
    "coverage>=7.14.3",
    "httpx>=0.28.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
    "mypy>=2.1.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

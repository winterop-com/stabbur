name: CI

# The quality gate for a repo that commits straight to main: run `make check`
# (ruff format + lint, mypy, pyright, pytest) on every code push and PR.
#
# Trimmed for a PRIVATE repo (Actions minutes are billed): Linux only — GitHub
# bills macOS runners at 10x Linux, and the macOS path (mlx/voice) is exercised by
# local `make check` on the dev Mac. Docs-only pushes are skipped. The `mlx`
# extra is env-marker-gated to darwin/arm64, so `uv sync --all-extras` on Linux
# still proves that gating no-ops (it installs only the Linux-compatible extras).

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:

# Newer pushes cancel superseded in-flight runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      # pyright (a Node tool under the hood) needs Node on PATH.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --all-extras
      - run: make check

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        working-directory: frontend
      # The SPA is otherwise entirely outside the quality gate — vite/esbuild strip
      # types without checking them, so a type error would ship silently.
      - run: bunx tsc --noEmit
        working-directory: frontend
      - run: bun run build
        working-directory: frontend

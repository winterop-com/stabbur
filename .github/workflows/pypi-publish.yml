name: Publish to PyPI

# Triggers:
#   - push of a `v*.*.*` tag (e.g. `v0.3.0`) — builds and publishes the `stabbur` wheel + sdist.
#   - manual dispatch.
#
# Authentication uses PyPI Trusted Publishing (OIDC) — no API tokens. Configure once on PyPI at
# https://pypi.org/manage/account/publishing/ (a "pending publisher" until the project exists):
#   PyPI project: stabbur
#   Owner: winterop-com   Repository: stabbur
#   Workflow filename: pypi-publish.yml   Environment: pypi
#
# stabbur is a SINGLE self-contained distribution: the bundled MCP tool servers are vendored into the
# `stabbur` package (src/stabbur/mcp_servers/*, src/stabbur/benchmark), so there are no `stabbur-*` runtime deps
# to publish alongside it.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Least-privilege default; the publish job overrides with the id-token: write it needs for OIDC.
permissions:
  contents: read

jobs:
  build:
    name: Build stabbur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # The wheel must CARRY the built SPA (staged into src/stabbur/webui), otherwise
      # `stabbur serve --ui` answers 404 for everyone who installed from PyPI while every
      # checkout keeps working - which is how that shipped unnoticed in 0.6.0-0.6.2.
      - name: Build and stage the browser UI
        run: make frontend-pack

      - name: Verify the SPA was staged
        run: test -f src/stabbur/webui/index.html

      - name: Build wheel + sdist
        run: uv build --package stabbur

      # A wheel without the SPA is the exact regression this job exists to prevent, so fail
      # here rather than publishing one.
      - name: Verify the wheel carries the SPA
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          if "stabbur/webui/index.html" not in names:
              sys.exit(f"::error::{wheel} does not contain stabbur/webui/index.html")
          print(f"{wheel}: {sum('webui' in n for n in names)} SPA files")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/stabbur
    permissions:
      # Trusted Publishing: PyPI verifies the OIDC token and accepts the upload without an API key.
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: List built artifacts
        run: ls -lah dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Idempotent re-runs: skip anything already on PyPI so a re-triggered tag doesn't error.
          skip-existing: true
          # No password — trusted publishing handles auth via the OIDC token minted above.

  # A tag that publishes to PyPI but creates no GitHub release leaves the repo page showing an
  # older version as "Latest" - which it did, naming a version from two renames ago. Generated
  # from the commits since the previous tag; edit the release afterwards to say more.
  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "stabbur ${TAG#v}" \
            --generate-notes \
            --latest \
            --verify-tag || echo "release already exists for ${TAG}"

  verify:
    name: Verify stabbur from PyPI
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Compute version from tag
        id: version
        run: echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Wait for stabbur on the PyPI simple index
        # uv resolves against the simple index, which lags the JSON endpoint by seconds, so poll
        # until the version appears. (PEP 625 filename normalization is a no-op for "stabbur" —
        # no separators to fold — so the name goes into the pattern below as-is.)
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          for i in $(seq 1 36); do
            if curl -fsSL "https://pypi.org/simple/stabbur/" \
              | grep -qE "stabbur-${VERSION}(\.tar\.gz|-[^ \"<>]*\.whl)"; then
              echo "stabbur ${VERSION} on simple index (attempt ${i})"; break
            fi
            if [ "${i}" = "36" ]; then
              echo "::error::stabbur ${VERSION} did not appear on the PyPI simple index within 180s"; exit 1
            fi
            echo "attempt ${i}/36: not yet, sleeping 5s"; sleep 5
          done

      - name: Smoke-test the published wheel
        # Install stabbur from PyPI into a throwaway env and run the CLI. Retry while the resolver-visible
        # index catches up to the simple index the wait step polled.
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          for attempt in $(seq 1 12); do
            if uvx --refresh --from "stabbur==${VERSION}" stabbur --help > /dev/null; then
              echo "stabbur ${VERSION} installs and runs"; exit 0
            fi
            echo "attempt ${attempt}/12 failed, sleeping 5s"; sleep 5
          done
          echo "::error::stabbur ${VERSION} never installed from PyPI"; exit 1

      - name: Serve the browser UI from the published wheel
        # `--help` passing proved nothing about the SPA: 0.6.0-0.6.2 all published a wheel with
        # no frontend in it, so `serve --ui` answered 404 at `/` for every PyPI user while every
        # checkout worked. Actually fetch the page.
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          export STABBUR_LIBRARY_ROOT="$(mktemp -d)"
          uvx --from "stabbur==${VERSION}" stabbur serve --ui --port 8933 &
          server=$!
          # Stop it however this step ends. Left running, the server outlives the step and uv's
          # post-job cache prune fails against the live process - the job then reports failure
          # even when every check above passed.
          trap 'kill "${server}" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            sleep 2
            code=$(curl -s -o /tmp/root.html -w '%{http_code}' "http://127.0.0.1:8933/" || true)
            [ "$code" = "200" ] && break
          done
          if [ "$code" != "200" ]; then
            echo "::error::serve --ui returned HTTP $code at / - the wheel is missing the SPA"; exit 1
          fi
          grep -qi '<div id="root"' /tmp/root.html \
            || { echo "::error::/ returned 200 but not the SPA shell"; exit 1; }
          echo "browser UI served from the published wheel"
          kill "${server}" 2>/dev/null || true
          wait "${server}" 2>/dev/null || true

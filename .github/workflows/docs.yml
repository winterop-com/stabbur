name: Docs

# Build the mkdocs site and publish it to the gh-pages branch (GitHub Pages
# serves that branch). Uses `mkdocs gh-deploy`, the same mechanism as a manual
# local deploy.
#
# MANUAL-ONLY while the repo is PRIVATE: GitHub Pages doesn't serve a private repo
# (on the current plan), so auto-deploying on every docs push just burns billed
# Actions minutes and produces an unreachable site. Re-add the `push:` trigger
# (docs/** + mkdocs.yml) if the repo goes public again.

on:
  workflow_dispatch:

permissions:
  contents: write # gh-deploy force-pushes the built site to gh-pages

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gh-deploy needs history to update the gh-pages branch
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Build and deploy to gh-pages
        run: >
          uv run --with mkdocs --with mkdocs-material --with 'mkdocstrings[python]'
          --with mkdocs-panzoom-plugin --with mkdocs-glightbox
          --with mkdocs-git-revision-date-localized-plugin
          mkdocs gh-deploy --force --no-history

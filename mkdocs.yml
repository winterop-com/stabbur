site_name: heim
site_description: Build a full local LLM library, then run, chat, and serve it — fully on-box.
site_url: https://winterop-com.github.io/heim/
repo_url: https://github.com/winterop-com/heim
repo_name: winterop-com/heim
docs_dir: docs
site_dir: site

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # Intentionally no navigation.tabs (no top tab bar) — sidebar sections only.
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - The library: guides/library.md
      - Pulling models: guides/pulling.md
      - Running & chatting: guides/running.md
      - Web UI (serve --ui): guides/web-ui.md
      - Voice (TTS & STT): guides/voice.md
      - Projects: guides/projects.md
      - Tools (MCP): guides/tools.md
      - How models work (formats & modalities): guides/how-models-work.md
      - Models & compatibility: guides/models.md
      - Using models directly: guides/direct-usage.md
      - Using heim's API: guides/api.md
  - Chrome side panel:
      - Overview: guides/extension.md
      - Prompt catalog: guides/extension-prompts.md
  - DHIS2 assistant:
      - Tools & profiles: guides/dhis2.md
      - Worked example: guides/dhis2-project.md
      - Benchmark report: guides/dhis2-benchmark-report.md
  - Reference:
      - CLI reference: cli.md
      - Model catalog (validated): guides/model-catalog.md
      - Benchmark leaderboard: benchmarks.md
  - Architecture: architecture.md
  - UI conventions: ui-conventions.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

plugins:
  - search
  # Click any content image (e.g. the extension screenshots) to open it fullscreen in a
  # zoomable lightbox. Targets <img> only, so it doesn't touch the Mermaid SVGs (panzoom below).
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      zoomable: true
      draggable: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
  # Pan/zoom + fullscreen on rendered Mermaid diagrams (the architecture graphs get large).
  - panzoom:
      mermaid: true
      full_screen: true
  # "Last updated" per page, from git history.
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true

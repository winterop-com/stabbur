site_name: kodo
site_description: Build a full local LLM library, then run, chat, and serve it — fully on-box.
repo_url: https://github.com/winterop-com/kodo
repo_name: winterop-com/kodo
docs_dir: docs
site_dir: site

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # Intentionally no navigation.tabs (no top tab bar) — sidebar sections only.
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - The library: guides/library.md
      - Pulling models: guides/pulling.md
      - Running & chatting: guides/running.md
      - Web UI (serve --ui): guides/web-ui.md
      - Voice (TTS & STT): guides/voice.md
      - Projects: guides/projects.md
      - Tools (MCP): guides/tools.md
      - "Chrome side panel": guides/extension.md
      - "Chrome side-panel prompts": guides/extension-prompts.md
      - "DHIS2 tools & profiles": guides/dhis2.md
      - "DHIS2 assistant (worked example)": guides/dhis2-project.md
      - "Model catalog (validated)": guides/model-catalog.md
      - "DHIS2 benchmark report": guides/dhis2-benchmark-report.md
      - Using models directly: guides/direct-usage.md
      - How models work (formats & modalities): guides/how-models-work.md
      - Models & compatibility: guides/models.md
  - Architecture: architecture.md
  - Benchmarks: benchmarks.md
  - CLI reference: cli.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source

name = "tools-search"
description = "Tool-use benchmark: answer a question by searching the web with the stabbur-mcp-search server."
type = "tool"
language = "tools"
# Attaches the search MCP server; passes if the model calls search with a sensible query AND
# its answer contains the expected fact. Uses the zero-config DuckDuckGo backend, so results
# vary — the expected substrings are stable facts likely to appear regardless of ranking.

[[problems]]
id = "capital-lookup"
difficulty = "basics"
prompt = "Search the web to find the capital of France, then tell me what it is. Use the available tools."
servers = ["stabbur-mcp-search"]
expect_tool = "search__search"
expect_answer_contains = "Paris"

[[problems]]
id = "who-created-python"
difficulty = "intermediate"
prompt = "Use web search to find who created the Python programming language, then name them."
servers = ["stabbur-mcp-search"]
expect_tool = "search__search"
expect_answer_contains = "Guido"

name = "tools-dhis2"
description = "Tool-use benchmark: answer questions about a live DHIS2 instance by driving the dhis2w-mcp-bridge (read-only)."
type = "tool"
language = "tools"
# Each problem attaches the DHIS2 CLI bridge against the `play42` profile in READ-ONLY mode and
# passes only if the model calls the bridge's single `dhis2_cli` tool AND its final answer contains
# the expected value. The bridge's command is `env DHIS2_PROFILE=play42 DHIS2_MCP_READONLY=1 uvx
# dhis2w-mcp-bridge`; since the benchmark connects each server with no explicit name, the tool is
# namespaced by the launch command's first token (`env`) -> `env__dhis2_cli`.
#
# `expect_args` is intentionally empty: the bridge has ONE tool driven by free-form `d2w` argv, so
# there are many valid ways to reach an answer. We score what matters -- did the model reach for the
# bridge, and did it return the right value -- not one exact argv. `expect_answer_contains` values
# are STABLE STRUCTURAL FACTS of the DHIS2 "Sierra Leone" demo (metadata counts, UIDs, names,
# version) captured from play42 on 2026-07-04, counts re-verified live 2026-07-14 (indicators had
# drifted 77 -> 78 and cost every model in that night's sweep exactly one point -- re-check these
# BEFORE blaming a model for a systematic miss). Analytics
# values are deliberately avoided -- the demo regenerates data relative to the current date, so no
# absolute analytics number is stable.

# --- basics: single direct read ---

[[problems]]
id = "system-name"
difficulty = "basics"
prompt = "What is the name of this DHIS2 system (its instance name)? Use the available tools."
servers = ["env DHIS2_PROFILE=play42 DHIS2_MCP_READONLY=1 uvx dhis2w-mcp-bridge"]
expect_tool = "env__dhis2_cli"
expect_answer_contains = "Sierra Leone"

[[problems]]
id = "server-version"
difficulty = "basics"
prompt = "Which DHIS2 version is this server running? Use the available tools."
servers = ["env DHIS2_PROFILE=play42 DHIS2_MCP_READONLY=1 uvx dhis2w-mcp-bridge"]
expect_tool = "env__dhis2_cli"
expect_answer_contains = "2.42"

[[problems]]
id = "whoami"
difficulty = "basics"
prompt = "What is the username of the currently logged-in DHIS2 user? Use the available tools."
servers = ["env DHIS2_PROFILE=play42 DHIS2_MCP_READONLY=1 uvx dhis2w-mcp-bridge"]
expect_tool = "env__dhis2_cli"
expect_answer_contains = "admin"

[[problems]]
id = "count-orgunits"
difficulty = "basics"
prompt = "How many organisation units are there in this DHIS2 instance? Use the available tools."
servers = ["env DHIS2_PROFILE=play42 DHIS2_MCP_READONLY=1 uvx dhis2w-mcp-bridge"]
expect_tool = "env__dhis2_cli"
expect_answer_contains = "1332"


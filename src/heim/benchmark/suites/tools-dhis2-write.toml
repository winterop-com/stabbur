name = "tools-dhis2-write"
description = "Tool-use benchmark: drive metadata WRITES (create / rename / delete) on a local DHIS2 via the dhis2w-mcp-bridge."
type = "tool"
language = "tools"
# Companion to `tools-dhis2` (read-only): this measures whether a model can safely DRIVE
# MUTATIONS. Each problem is a self-cleaning LIFECYCLE — it creates objects, optionally
# renames/links them, then DELETES everything it made, so a run leaves the instance as it
# found it and re-runs across models don't collide. Every test object is prefixed `HEIM_`.
#
# The bridge runs READ-WRITE (no DHIS2_MCP_READONLY) against the `local_basic` profile
# (localhost:8080, admin/district) — never point this at a shared/production instance.
#
# SCORING IS STATEFUL (see heim.benchmark.core.score_tool_stateful): each problem lists the
# objects it creates in `expect_absent`. After the run the benchmark reads the LIVE instance
# back (via heim.benchmark.dhis2_state, using the same profile) and passes the problem only if
# (a) a create actually SUCCEEDED mid-lifecycle and (b) every listed object is ABSENT at the
# end — real proof of created-then-deleted, not the old vacuous "called the tool once + said a
# token". The `LIFECYCLE_OK` token and the tool call are recorded as SECONDARY signals; the
# token is also the fallback verdict when the instance is unreachable (offline runs degrade to
# trace-only scoring instead of crashing). `expect_args` is intentionally unused — the single
# `dhis2_cli` tool is driven by free-form `d2w` argv, and the live state check supersedes it.
#
# The runner performs a REAL `HEIM_` residue sweep (heim.benchmark.dhis2_state.sweep_residue)
# before AND after each model's write suite: it lists every `HEIM_`-named object of the
# resource types this suite touches (dataElements, dataElementGroups, indicators,
# indicatorGroups) and DELETEs them, so a model that abandons a lifecycle can't leave residue
# that compounds across models. The sweep only ever touches `HEIM_`-prefixed objects and skips
# cleanly if the instance is unreachable. Because the server command starts with `env`, the
# tool namespaces to `env__dhis2_cli`.

# --- basics: a single create + delete ---

[[problems]]
id = "de-create-delete"
difficulty = "basics"
prompt = "Using the available DHIS2 tools, create one aggregate data element with value type NUMBER named 'HEIM_DE1' (short name 'HEIM_DE1'), then delete it. When BOTH the create and the delete have succeeded, reply with exactly: LIFECYCLE_OK"
servers = ["env DHIS2_PROFILE=local_basic uvx dhis2w-mcp-bridge"]
expect_tool = "env__dhis2_cli"
expect_answer_contains = "LIFECYCLE_OK"
expect_absent = [{ type = "dataElements", name = "HEIM_DE1" }]

[[problems]]
id = "ig-create-delete"
difficulty = "basics"
prompt = "Using the available DHIS2 tools, create an indicator group named 'HEIM_IG1', then delete it. When BOTH have succeeded, reply with exactly: LIFECYCLE_OK"
servers = ["env DHIS2_PROFILE=local_basic uvx dhis2w-mcp-bridge"]
expect_tool = "env__dhis2_cli"
expect_answer_contains = "LIFECYCLE_OK"
expect_absent = [{ type = "indicatorGroups", name = "HEIM_IG1" }]

# --- intermediate: create + a second operation + delete ---

[[problems]]
id = "de-rename-delete"
difficulty = "intermediate"
prompt = "Using the available DHIS2 tools: create an aggregate NUMBER data element named 'HEIM_DE2' (short name 'HEIM_DE2'), then rename it to 'HEIM_DE2_v2', then delete it. When all three steps have succeeded, reply with exactly: LIFECYCLE_OK"
servers = ["env DHIS2_PROFILE=local_basic uvx dhis2w-mcp-bridge"]
expect_tool = "env__dhis2_cli"
expect_answer_contains = "LIFECYCLE_OK"
# `HEIM_DE2` prefix-matches both the original and the renamed `HEIM_DE2_v2` (a `like` filter).
expect_absent = [{ type = "dataElements", name = "HEIM_DE2" }]

[[problems]]
id = "deg-create-delete"
difficulty = "intermediate"
prompt = "Using the available DHIS2 tools, create a data element group named 'HEIM_DEG1', then delete it. When both have succeeded, reply with exactly: LIFECYCLE_OK"
servers = ["env DHIS2_PROFILE=local_basic uvx dhis2w-mcp-bridge"]
expect_tool = "env__dhis2_cli"
expect_answer_contains = "LIFECYCLE_OK"
expect_absent = [{ type = "dataElementGroups", name = "HEIM_DEG1" }]

# --- advanced: create, verify by reading back, then delete ---

[[problems]]
id = "de-create-verify-delete"
difficulty = "advanced"
prompt = "Using the available DHIS2 tools: create an aggregate NUMBER data element named 'HEIM_DE3' (short name 'HEIM_DE3'). Then look it up again by name to confirm it exists and note its UID. Then delete it by that UID. When done, reply with exactly: LIFECYCLE_OK"
servers = ["env DHIS2_PROFILE=local_basic uvx dhis2w-mcp-bridge"]
expect_tool = "env__dhis2_cli"
expect_answer_contains = "LIFECYCLE_OK"
expect_absent = [{ type = "dataElements", name = "HEIM_DE3" }]

[[problems]]
id = "deg-add-member-delete"
difficulty = "advanced"
prompt = "Using the available DHIS2 tools: create an aggregate NUMBER data element named 'HEIM_DE4' (short name 'HEIM_DE4') and a data element group named 'HEIM_DEG2'. Add the data element as a member of the group. Then delete BOTH the group and the data element. When everything has succeeded, reply with exactly: LIFECYCLE_OK"
servers = ["env DHIS2_PROFILE=local_basic uvx dhis2w-mcp-bridge"]
expect_tool = "env__dhis2_cli"
expect_answer_contains = "LIFECYCLE_OK"
expect_absent = [
    { type = "dataElementGroups", name = "HEIM_DEG2" },
    { type = "dataElements", name = "HEIM_DE4" },
]

# --- expert: resolve a dependency, then create + delete ---

[[problems]]
id = "indicator-create-delete"
difficulty = "expert"
prompt = "Using the available DHIS2 tools: find any existing indicator type and note its UID, then create an indicator named 'HEIM_IND1' (short name 'HEIM_IND1') using that indicator type, then delete the indicator. When done, reply with exactly: LIFECYCLE_OK"
servers = ["env DHIS2_PROFILE=local_basic uvx dhis2w-mcp-bridge"]
expect_tool = "env__dhis2_cli"
expect_answer_contains = "LIFECYCLE_OK"
expect_absent = [{ type = "indicators", name = "HEIM_IND1" }]
